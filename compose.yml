services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "127.0.0.1:3318:3000"
    volumes:
      - gallery_data:/data
    mem_limit: 1g
    cpus: 1.5
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    user: "1001:1001"
    command: [tunnel, --no-autoupdate, --config, /etc/cloudflared/config.yml, run]
    volumes:
      - ./tunnel:/etc/cloudflared:ro
    depends_on: [web]
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  gallery_data:
